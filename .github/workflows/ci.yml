name: Integracion Continua - CI

on:
  push:
    branches:
      - feature/automatizacion-cicd
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilacion y pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compilar proyecto
        run: make build

      - name: Ejecutar pruebas unitarias
        run: make test
