
name: Entrega Continua - Docker

on:
  push:
    branches:
      - feature/entrega-continua
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Construccion y publicacion Docker
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Ejecutar pruebas unitarias
        run: make test

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticacion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        id: imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jaimessi010/desktop-cloud-provider:ci-cd
          labels: |
            org.opencontainers.image.source=https://github.com/Jaimessi010/desktop-cloud-provider
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verificar imagen publicada
        id: verificar
        run: |
          docker buildx imagetools inspect ghcr.io/jaimessi010/desktop-cloud-provider:ci-cd

      - name: Mostrar resumen de entrega
        if: always()
        env:
          PUBLICACION: ${{ steps.imagen.outcome }}
          VERIFICACION: ${{ steps.verificar.outcome }}
        run: |
          echo "## Resultados de entrega Docker" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Etapa | Resultado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Construccion y publicacion | $PUBLICACION |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Verificacion de imagen | $VERIFICACION |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$PUBLICACION" == "success" &&
                "$VERIFICACION" == "success" ]]; then
            echo "### ✅ IMAGEN DOCKER PUBLICADA CORRECTAMENTE" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Imagen: \`ghcr.io/jaimessi010/desktop-cloud-provider:ci-cd\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ ENTREGA DOCKER NO COMPLETADA" >> "$GITHUB_STEP_SUMMARY"
            echo "Revisar los registros del workflow." >> "$GITHUB_STEP_SUMMARY"
          fi
