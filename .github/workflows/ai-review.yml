
name: IA - Analisis de integracion continua

on:
  push:
    branches:
      - fix/compatibilidad-pruebas
    paths:
      - '.github/workflows/ai-review.yml'
      - 'scripts/ai_analyzer.py'
      - '.github/workflows/ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  analizar-cambios:
    name: Revision mediante inteligencia artificial
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Obtener rama principal
        run: git fetch origin main

      - name: Verificar configuracion de IA
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "ERROR: Falta OPENAI_API_KEY"
            exit 1
          fi

          echo "Credencial de IA configurada"

      - name: Ejecutar analizador de IA
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/ai_analyzer.py

      - name: Confirmar analisis completado
        if: success()
        run: |
          echo "### Analisis de IA finalizado" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "El informe fue generado correctamente." \
            >> "$GITHUB_STEP_SUMMARY"
