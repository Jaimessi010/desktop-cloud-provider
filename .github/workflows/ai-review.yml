
name: IA - Validacion del analizador

on:
  push:
    branches:
      - fix/compatibilidad-pruebas
    paths:
      - 'scripts/ai_analyzer.py'
      - '.github/workflows/ai-review.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-analizador:
    name: Validacion del analizador de IA
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verificar sintaxis de Python
        run: python -m py_compile scripts/ai_analyzer.py

      - name: Obtener rama principal
        run: git fetch origin main

      - name: Validar analizador
        run: python scripts/ai_analyzer.py --check

      - name: Generar resumen
        run: |
          {
            echo "## Validacion del analizador de IA"
            echo ""
            echo "Estado: validacion estructural completada."
            echo ""
            echo "El analisis con Ollama se ejecuta localmente."
            echo "Este workflow no consulta un modelo de IA."
          } >> "$GITHUB_STEP_SUMMARY"
